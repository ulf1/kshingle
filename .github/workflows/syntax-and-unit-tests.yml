name: Test

on: [push, workflow_dispatch]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ['ubuntu-18.10', 'ubuntu-latest', 'windows-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13']

    name: ${{ matrix.os }} ${{ matrix.python-version }} Tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - name: Cache pip
      uses: actions/cache@v4.2.3
      with:
        path: |
          ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('setup.py', 'requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pytest-html pytest-cov

    - name: Lint with flake8
      run: |
        flake8 --ignore=F401 --exclude=$(grep -v '^#' .gitignore | xargs | sed -e 's/ /,/g')

    - name: Unit Test with pytest
      run: |
        pytest --junitxml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml --html=test-report.html --self-contained-html --cov --cov-report=xml --cov-report=term-missing
      continue-on-error: true

    - name: Test Report
      uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}
      with:
        name: 'Pytest Results (${{ matrix.os }}, Python ${{ matrix.python-version }})'
        path: 'test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml'
        reporter: 'java-junit'
        fail-on-error: true
        fail-on-empty: true
        max-annotations: 128
        list-suites: 'failed'
        list-tests: 'failed'

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-artifacts-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
          test-report.html
          coverage.xml
        retention-days: 30
